sentence=Read the fused position of an EchoGuard-8 GNSS array over SPI.
paragraph=EchoGuard-8 is an open hardware board that fuses 8 GNSS receivers into one position with outlier rejection and a trust status. This library reads its CRC-protected SPI packet and gives you latitude, longitude, altitude, HDOP, the number of receivers used and rejected, and an OK / DEGRADED / INTERFERENCE / NO_FIX status.
